# Render.com 一键部署配置（免费档）
# 在 Render 控制台选择 New → Blueprint，指向本 GitHub 仓库即可
services:
  - type: web
    name: learning-support-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd src && python3 -m uvicorn learning_support.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
